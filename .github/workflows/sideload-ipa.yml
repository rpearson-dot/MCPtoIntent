name: Sideload IPA

# Builds an UNSIGNED .ipa for the SideStore / AltStore route: no Apple credentials needed here, because SideStore
# re-signs the app with your free Apple ID when it installs it. Download the "MCPtoIntent-ipa" artifact from the run.
on:
  push:
    branches: [main]
  workflow_dispatch:

# NOTE: GitHub-hosted macOS runners need a payment method on file for your account (an anti-abuse gate), even though
# public-repo macOS minutes are free. Until that's added this job is cancelled with no runner. If you'd rather not add
# a card, use codemagic.yaml instead (free macOS tier, no card) — same build.
#
# Hardening: the token is scoped to `contents: write` — the least that still lets the job publish the .ipa to a
# Release — and nothing more; checkout doesn't leave credentials on disk, and the Release step uses the preinstalled
# gh CLI (no third-party action). For maximum supply-chain hardening, pin actions to a full commit SHA instead of a
# @v5 tag (a tag can be moved); kept on @v5 here so it tracks the latest within the major version.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build (Sideload config, unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -project MCPtoIntent.xcodeproj \
            -scheme MCPtoIntent \
            -configuration Sideload \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .ipa
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Sideload-iphoneos -maxdepth 1 -name "*.app" | head -n1)
          test -n "$APP" || { echo "no .app produced"; exit 1; }
          echo "Packaging $APP"
          rm -rf Payload MCPtoIntent.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r MCPtoIntent.ipa Payload >/dev/null
          ls -la MCPtoIntent.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: MCPtoIntent-ipa
          path: MCPtoIntent.ipa
          if-no-files-found: error

      # Publish to a rolling "latest" release so there's a permanent, no-sign-in download link:
      #   https://github.com/rpearson-dot/MCPtoIntent/releases/latest/download/MCPtoIntent.ipa
      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest MCPtoIntent.ipa \
            --title "Latest build" \
            --target "$GITHUB_SHA" \
            --notes "Unsigned .ipa for SideStore / AltStore (free Apple ID re-signs it on install). Built $(date -u '+%Y-%m-%d %H:%M UTC') from ${GITHUB_SHA:0:7}."
